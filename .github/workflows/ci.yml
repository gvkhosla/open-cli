name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content data
        run: npm run validate:data

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check search recommendations
        run: |
          npm start > /tmp/opencli-test.log 2>&1 &
          trap 'kill $! || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://localhost:3000/ -o /dev/null
          node scripts/test-search.mjs
